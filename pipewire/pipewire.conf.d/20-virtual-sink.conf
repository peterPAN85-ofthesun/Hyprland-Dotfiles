# ╔═══════════════════════════════════════════════════════════╗
# ║  Sortie virtuelle — hub de brassage                       ║
# ╚═══════════════════════════════════════════════════════════╝
#
# Crée un périphérique de sortie virtuel qui apparaît comme n'importe
# quelle carte son dans les sélecteurs (barre quickshell, Configuration
# Système → son, pavucontrol, wpctl…). On peut donc basculer dessus ou
# revenir à un périphérique physique en un clic.
#
# Ce n'est pas une carte : c'est un *point de brassage*. Les applis y
# jouent, et ses ports `monitor` sont ensuite reliés librement — vers
# une ou plusieurs sorties physiques à la fois, ou à travers Carla pour
# insérer des plugins. Rien n'est câblé ici : le routage se fait dans le
# patchbay (voir CLAUDE.md), ce qui évite de figer des identifiants
# matériels dans un fichier versionné.
#
# Tant que son monitor n'est relié à rien, le sink est piloté par
# l'horloge dummy de PipeWire ; dès qu'il est relié à un périphérique
# réel, celui-ci devient le driver du graphe — pas de rééchantillonnage.

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            media.class      = Audio/Sink

            node.name        = "virtual-out"
            node.description = "Sortie Virtuelle"
            node.nick        = "Sortie Virtuelle"

            audio.position   = [ FL FR ]

            # Le curseur de volume du sélecteur agit sur les ports
            # monitor. Sans ça, le slider serait décoratif.
            monitor.channel-volumes = true

            # Priorité basse : WirePlumber ne doit jamais le choisir
            # comme sortie par défaut tout seul (branchement d'un
            # casque, réveil…). La bascule reste manuelle.
            priority.session = 500
            priority.driver  = 500

            # Reste présent même sans lecture, sinon les liens du
            # patchbay sautent dès qu'il n'y a plus de son.
            node.pause-on-idle = false
        }
    }
]
