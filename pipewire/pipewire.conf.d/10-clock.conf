# ╔═══════════════════════════════════════════════════════════╗
# ║  PipeWire — profil basse latence fixe (MAO / JACK)        ║
# ╚═══════════════════════════════════════════════════════════╝
#
# Drop-in : complète /usr/share/pipewire/pipewire.conf sans le remplacer.
# Les fichiers de ce dossier sont chargés par ordre alphabétique.
#
# Quantum verrouillé à 128 frames → ~2,7 ms @ 48 kHz, constamment.
# Compromis assumé : le graphe tourne à 128 même au repos, donc plus de
# réveils CPU et une autonomie réduite sur batterie. Toutes les applis
# (Firefox, Discord…) partagent ce quantum, pas seulement les clients JACK.
#
# Pour revenir au comportement dynamique : supprimer ce fichier, ou
# remettre min-quantum = 32 / max-quantum = 2048 ci-dessous.

context.properties = {
    # Fréquence par défaut ; PipeWire bascule l'horloge matérielle vers
    # l'une des `allowed-rates` si une appli le demande (évite le
    # rééchantillonnage des sessions 44.1 kHz ou hi-res).
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]

    # Quantum figé : min = max = quantum.
    default.clock.quantum       = 128
    default.clock.min-quantum   = 128
    default.clock.max-quantum   = 128
}
