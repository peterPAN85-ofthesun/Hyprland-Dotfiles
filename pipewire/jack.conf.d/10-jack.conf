# ╔═══════════════════════════════════════════════════════════╗
# ║  Couche JACK de PipeWire (pipewire-jack)                  ║
# ╚═══════════════════════════════════════════════════════════╝
#
# Lu par la libjack de remplacement fournie par le paquet `pipewire-jack`.
# S'applique donc à tout client JACK : ardour, carla, qjackctl,
# jack_mixer, adljack, jacktrip, yabridge…
#
# Pas de jackd à lancer : le serveur JACK *est* PipeWire. `qjackctl` ne
# sert plus qu'à la visualisation ; pour le patchbay, préférer `qpwgraph`
# qui voit aussi les flux PulseAudio et ALSA.

jack.properties = {
    # Taille de buffer annoncée aux clients JACK. Doit rester cohérente
    # avec default.clock.quantum de 10-clock.conf.
    node.latency         = 1024/48000

    # Expose les ports monitor sur le même client que la lecture, comme
    # le fait jackd — sinon Ardour & co les voient comme un client à part.
    jack.merge-monitor   = true

    # Corrige les messages MIDI mal formés émis par certains clients.
    jack.fix-midi-events = true
}
