$lock_cmd = hyprctl dispatch global quickshell:lock & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    # Hyprland drops keyboard focus on the lock surface after a resume, sometimes more
    # than once. Retry the refocus for a few seconds instead of a single shot at t+2s,
    # otherwise the first characters typed are lost and the password looks wrong.
    after_sleep_cmd = for i in 1 2 3 4 5; do sleep 1; hyprctl dispatch global quickshell:lockFocus; done
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
