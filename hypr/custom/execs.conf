# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# hyprland-session.target BindsTo graphical-session.target — sans ces deux lignes,
# les services PartOf=graphical-session.target (xdph, etc.) ne sont jamais stoppés et
# bouclent en restart-failure quand Wayland disparaît à la sortie.
# Le unit vit dans ~/.config/systemd/user/ (hors dotfiles — à recréer par machine).
exec-once = systemctl --user start hyprland-session.target
exec-shutdown = systemctl --user stop hyprland-session.target

# Input method
# exec-once = fcitx5


