# Put general config stuff here
# Here's a list of every variable: https://wiki.hyprland.org/Configuring/Variables/

# monitor=,addreserved, 0, 0, 0, 0 # Custom reserved area

# HDMI port: mirror display. To see device name, use `hyprctl monitors`

general {
    # Espacement des fenêtres réduit de moitié par rapport à l'upstream
    # (hyprland/general.conf : gaps_in = 4, gaps_out = 5).
    # Hyprland tronque les décimales, donc 5 / 2 = 2,5 est arrondi à 3
    # pour conserver une marge de bord supérieure à la marge intérieure.
    gaps_in  = 2
    gaps_out = 3
}

cursor {
    no_warps = true
}

dwindle {
    # 0 = auto, 1 = always split to the left/top, 2 = always split to the right/bottom
    force_split = 2
}
